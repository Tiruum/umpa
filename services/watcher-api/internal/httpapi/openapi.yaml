openapi: 3.0.3
info:
  title: Watcher API
  version: 1.0.0
  description: API для управления watch-записями
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/watches:
    get:
      summary: List watches
      operationId: listWatches
      responses:
        "200":
          description: Watches list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Watch"
    post:
      summary: Create watch
      operationId: createWatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watch"
        "400":
          description: Bad request
  /api/watches/{id}:
    get:
      summary: Get watch by id
      operationId: getWatchById
      parameters:
        - $ref: "#/components/parameters/WatchId"
      responses:
        "200":
          description: Watch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watch"
        "400":
          description: Bad request
        "404":
          description: Not found
    put:
      summary: Update watch by id
      operationId: updateWatchById
      parameters:
        - $ref: "#/components/parameters/WatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWatchInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watch"
        "400":
          description: Bad request
        "404":
          description: Not found
    delete:
      summary: Delete watch by id
      operationId: deleteWatchById
      parameters:
        - $ref: "#/components/parameters/WatchId"
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
        "404":
          description: Not found
components:
  parameters:
    WatchId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Watch:
      type: object
      required: [id, name, url, selector]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
        selector:
          type: string
    CreateWatchInput:
      type: object
      required: [name, url, selector]
      properties:
        name:
          type: string
        url:
          type: string
        selector:
          type: string
    UpdateWatchInput:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        selector:
          type: string
